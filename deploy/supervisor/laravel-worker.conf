[program:product-categorization-worker]
; Supervisor worker for queued prediction jobs (Phase 7).
; Ensure .env uses QUEUE_CONNECTION=redis and Redis is reachable.
; Reload supervisor after changes: supervisorctl reread && supervisorctl update
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/product-categorization-backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/product-categorization-backend/storage/logs/worker.log
stopwaitsecs=3600
