[program:product-categorization-ml]
command=/var/www/product-categorization-backend/ml-service/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001
directory=/var/www/product-categorization-backend/ml-service
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/product-categorization-backend/storage/logs/ml-service.log
