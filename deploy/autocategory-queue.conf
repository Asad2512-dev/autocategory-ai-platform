; Supervisor — Laravel database queue worker (AutoCategory AI)
; Install: sudo apt install supervisor
;
; 1. Edit paths below: SITE_USER = CloudPanel site Linux user, LARAVEL_ROOT = directory containing artisan (not public/).
; 2. Copy to: sudo cp deploy/autocategory-queue.conf /etc/supervisor/conf.d/autocategory-queue.conf
; 3. sudo supervisorctl reread && sudo supervisorctl update

[program:autocategory-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/SITE_USER/htdocs/YOUR_DOMAIN/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=SITE_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/home/SITE_USER/htdocs/YOUR_DOMAIN/storage/logs/worker.log
stopwaitsecs=3600
